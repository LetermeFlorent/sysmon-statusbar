name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npx --yes @vscode/vsce package --out sysmon-statusbar-${GITHUB_REF_NAME}.vsix
      - name: Publish to the Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish --packagePath sysmon-statusbar-${GITHUB_REF_NAME}.vsix
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" sysmon-statusbar-${GITHUB_REF_NAME}.vsix --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md"
